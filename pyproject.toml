version = "0.1.0"
description = "Local Apple Silicon reproduction and real-data smoke tests for MSH-Net"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "numpy==1.26.4",
  "scipy==1.14.1",
  "h5py==3.12.1",
  "mat73==0.65",
  "opencv-python-headless==4.10.0.84",
  "scikit-learn==1.6.1",
  "matplotlib==3.9.4",
  "tqdm==4.67.1",
  "gdown==5.2.0",
]

[tool.uv]
package = false
